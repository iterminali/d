
name: "Windows EXE Builder"

on:
  push:
    paths:
      - "main.py"
      - ".github/workflows/build.yml"
  pull_request:
    paths:
      - "main.py"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Verify main.py
        run: |
          if (!(Test-Path "main.py")) {
            Write-Error "main.py not found in root folder"
            exit 1
          }

      - name: Build Windows EXE
        run: |
          pyinstaller `
            --onefile `
            --noconsole `
            --clean `
            --noconfirm `
            --name main `
            --distpath dist `
            main.py

      - name: Verify executable
        run: |
          if (!(Test-Path "dist/main.exe")) {
            Write-Error "EXE build failed"
            exit 1
          }

          Get-Item dist/main.exe

      - name: Generate SHA256
        run: |
          $hash = (Get-FileHash "dist/main.exe" -Algorithm SHA256).Hash
          Set-Content "dist/main.exe.sha256" $hash

      - name: Upload PR artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: Windows-EXE-${{ github.sha }}
          path: |
            dist/main.exe
            dist/main.exe.sha256

      - name: Determine release version
        if: github.event_name != 'pull_request'
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            PRERELEASE=false
          else
            TAG="windows-build-${GITHUB_RUN_NUMBER}"
            PRERELEASE=true
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        shell: bash
        run: |
          set -e

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              dist/main.exe \
              dist/main.exe.sha256 \
              --clobber
          else
            ARGS=()

            if [ "$PRERELEASE" = "true" ]; then
              ARGS+=(--prerelease)
            fi

            gh release create "$TAG" \
              dist/main.exe \
              dist/main.exe.sha256 \
              --target "$GITHUB_SHA" \
              --title "Windows EXE Build $TAG" \
              --generate-notes \
              "${ARGS[@]}"
          fi

      - name: Build Summary
        if: always()
        run: |
          echo "## Windows EXE Build" >> $env:GITHUB_STEP_SUMMARY
          echo "" >> $env:GITHUB_STEP_SUMMARY
          echo "- Application: main.exe" >> $env:GITHUB_STEP_SUMMARY
          echo "- Builder: PyInstaller" >> $env:GITHUB_STEP_SUMMARY
          echo "- Console: Disabled" >> $env:GITHUB_STEP_SUMMARY
          echo "- Mode: One-file" >> $env:GITHUB_STEP_SUMMARY

      - name: Release URL
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          URL=$(gh release view "$TAG" --json url --jq .url)
          echo "### Download" >> "$GITHUB_STEP_SUMMARY"
          echo "$URL" >> "$GITHUB_STEP_SUMMARY"
