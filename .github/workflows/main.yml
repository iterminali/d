name: "GoldHEN PRX Source Dumper"

on:
  push:
    paths:
      - "input/**"
      - ".github/workflows/prx-release.yml"
  pull_request:
    paths:
      - "input/**"
      - ".github/workflows/prx-release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  decompile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            openjdk-21-jdk \
            unzip \
            curl \
            jq \
            file \
            binutils

      - name: Download Ghidra
        run: |
          URL=$(curl -fsSL \
            https://api.github.com/repos/NationalSecurityAgency/ghidra/releases/latest \
            | jq -r '.assets[] |
              select(.name | test("^ghidra_.*_PUBLIC_.*\\.zip$")) |
              .browser_download_url' | head -n 1)

          if [ -z "$URL" ]; then
            echo "Ghidra download URL not found"
            exit 1
          fi

          curl -fL "$URL" -o ghidra.zip
          unzip -q ghidra.zip -d ghidra
          GHIDRA=$(find ghidra -name analyzeHeadless -type f | head -n 1)

          if [ -z "$GHIDRA" ]; then
            echo "Ghidra installation failed"
            exit 1
          fi

          echo "GHIDRA=$GHIDRA" >> "$GITHUB_ENV"

      - name: Create decompiler script
        run: |
          mkdir -p scripts output

          cat > scripts/Decompile.java <<'JAVA'
          import ghidra.app.decompiler.*;
          import ghidra.app.script.GhidraScript;
          import ghidra.program.model.listing.*;
          import java.io.*;

          public class Decompile extends GhidraScript {
              public void run() throws Exception {
                  File out = new File(getScriptArgs()[0]);
                  out.mkdirs();

                  DecompInterface dc = new DecompInterface();
                  dc.openProgram(currentProgram);

                  PrintWriter c = new PrintWriter(
                      new File(out, "decompiled.c"));
                  PrintWriter symbols = new PrintWriter(
                      new File(out, "symbols.txt"));
                  PrintWriter asm = new PrintWriter(
                      new File(out, "assembly.asm"));

                  FunctionIterator functions =
                      currentProgram.getFunctionManager()
                      .getFunctions(true);

                  while (functions.hasNext()) {
                      Function f = functions.next();

                      symbols.println(
                          f.getName() + " @ " + f.getEntryPoint());

                      DecompileResults result =
                          dc.decompileFunction(f, 120, monitor);

                      c.println("/* " + f.getName() + " */");

                      if (result.decompileCompleted()
                          && result.getDecompiledFunction() != null) {
                          c.println(
                              result.getDecompiledFunction().getC());
                      } else {
                          c.println("/* Decompilation unavailable */");
                      }
                  }

                  InstructionIterator instructions =
                      currentProgram.getListing()
                      .getInstructions(true);

                  while (instructions.hasNext()) {
                      Instruction i = instructions.next();
                      asm.println(i.getAddress() + " " + i);
                  }

                  c.close();
                  symbols.close();
                  asm.close();
                  dc.dispose();
              }
          }
          JAVA

      - name: Analyze PRX files
        run: |
          mkdir -p input output
          FOUND=0

          for PRX in input/*.prx; do
            [ -f "$PRX" ] || continue
            FOUND=1

            NAME=$(basename "$PRX" .prx)
            DEST="output/$NAME"

            mkdir -p "$DEST"
            cp "$PRX" "$DEST/original.prx"

            file "$PRX" > "$DEST/file_info.txt"
            strings -a "$PRX" > "$DEST/strings.txt"
            readelf -a "$PRX" > "$DEST/elf_info.txt" 2>&1 || true
            objdump -D "$PRX" > "$DEST/disassembly.txt" 2>&1 || true

            "$GHIDRA" \
              /tmp/ghidra-project \
              "$NAME" \
              -import "$PRX" \
              -scriptPath scripts \
              -postScript Decompile.java "$DEST" \
              -deleteProject || {
                echo "Ghidra analysis failed for $NAME"
                echo "Check PRX format and architecture."
              }

            (
              cd "$DEST"
              sha256sum original.prx > SHA256SUMS.txt
            )
          done

          if [ "$FOUND" -eq 0 ]; then
            echo "No PRX files found in input/"
            exit 1
          fi

      - name: Package dump
        run: |
          cd output
          zip -qr ../GoldHEN-PRX-Source-Dump.zip .

          cd ..
          sha256sum GoldHEN-PRX-Source-Dump.zip \
            > GoldHEN-PRX-Source-Dump.sha256

          ls -lh GoldHEN-PRX-Source-Dump.*

      - name: Upload PR artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: GoldHEN-PRX-${{ github.sha }}
          path: |
            GoldHEN-PRX-Source-Dump.zip
            GoldHEN-PRX-Source-Dump.sha256

      - name: Determine release tag
        if: github.event_name != 'pull_request'
        id: vars
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            echo "tag_name=$TAG" >> "$GITHUB_OUTPUT"
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          else
            TAG="prx-dump-${GITHUB_RUN_NUMBER}"
            echo "tag_name=$TAG" >> "$GITHUB_OUTPUT"
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish PRX source dump
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.vars.outputs.tag_name }}
          IS_REL: ${{ steps.vars.outputs.is_release }}
        run: |
          set -e

          if [ "$IS_REL" = "true" ]; then
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release upload "$TAG" \
                GoldHEN-PRX-Source-Dump.zip \
                GoldHEN-PRX-Source-Dump.sha256 \
                --clobber
            else
              gh release create "$TAG" \
                GoldHEN-PRX-Source-Dump.zip \
                GoldHEN-PRX-Source-Dump.sha256 \
                --target "$GITHUB_SHA" \
                --title "GoldHEN PRX Dump $TAG" \
                --generate-notes
            fi
          else
            gh release create "$TAG" \
              GoldHEN-PRX-Source-Dump.zip \
              GoldHEN-PRX-Source-Dump.sha256 \
              --target "$GITHUB_SHA" \
              --title "GoldHEN PRX Dump $TAG" \
              --prerelease \
              --generate-notes
          fi

      - name: Print release URL
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.vars.outputs.tag_name }}
        run: |
          URL=$(gh release view "$TAG" --json url --jq .url)
          SHA=$(sha256sum GoldHEN-PRX-Source-Dump.zip | awk '{print $1}')

          {
            echo "=================================="
            echo "GOLDHEN PRX DUMP SUCCESSFUL"
            echo "=================================="
            echo "Release URL: $URL"
            echo "SHA-256: $SHA"
            echo "=================================="
          } | tee -a "$GITHUB_STEP_SUMMARY"

          echo "[Download PRX Source Dump]($URL)" \
            >> "$GITHUB_STEP_SUMMARY"
