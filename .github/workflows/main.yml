name: "GoldHEN Full PRX Decompiler"

on:
  push:
    paths:
      - "input/**"
      - ".github/workflows/prx-dumper.yml"
  pull_request:
    paths:
      - "input/**"
      - ".github/workflows/prx-dumper.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  decompile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            openjdk-21-jdk \
            unzip curl jq \
            binutils file python3 zip

      - name: Download Ghidra
        run: |
          URL=$(curl -fsSL \
            https://api.github.com/repos/NationalSecurityAgency/ghidra/releases/latest \
            | jq -r '.assets[] |
              select(.name | test("^ghidra_.*_PUBLIC_.*\\.zip$")) |
              .browser_download_url' | head -n 1)

          test -n "$URL"
          curl -fL "$URL" -o ghidra.zip
          unzip -q ghidra.zip -d ghidra

          GHIDRA=$(find ghidra -name analyzeHeadless -type f | head -n 1)
          test -n "$GHIDRA"

          chmod +x "$GHIDRA"
          echo "GHIDRA=$GHIDRA" >> "$GITHUB_ENV"

      - name: Prepare folders
        run: |
          mkdir -p input scripts output

      - name: Create Ghidra decompiler
        run: |
          cat > scripts/Decompile.java <<'JAVA'
          import ghidra.app.decompiler.*;
          import ghidra.app.script.GhidraScript;
          import ghidra.program.model.listing.*;
          import ghidra.program.model.symbol.*;
          import java.io.*;

          public class Decompile extends GhidraScript {
              public void run() throws Exception {
                  File out = new File(getScriptArgs()[0]);
                  out.mkdirs();

                  DecompInterface dc = new DecompInterface();
                  dc.openProgram(currentProgram);

                  PrintWriter c = new PrintWriter(
                      new File(out, "decompiled.c"));

                  PrintWriter symbols = new PrintWriter(
                      new File(out, "symbols.txt"));

                  PrintWriter imports = new PrintWriter(
                      new File(out, "imports.txt"));

                  PrintWriter asm = new PrintWriter(
                      new File(out, "assembly.asm"));

                  FunctionIterator functions =
                      currentProgram.getFunctionManager()
                      .getFunctions(true);

                  while (functions.hasNext()) {
                      Function f = functions.next();

                      symbols.println(
                          f.getName() + " @ " + f.getEntryPoint());

                      DecompileResults result =
                          dc.decompileFunction(f, 120, monitor);

                      c.println("\n/* Function: " +
                          f.getName() + " */");

                      if (result.decompileCompleted()
                          && result.getDecompiledFunction() != null) {
                          c.println(
                              result.getDecompiledFunction().getC());
                      } else {
                          c.println(
                              "/* Decompilation unavailable */");
                      }
                  }

                  SymbolIterator symbolsIterator =
                      currentProgram.getSymbolTable().getAllSymbols(true);

                  while (symbolsIterator.hasNext()) {
                      Symbol s = symbolsIterator.next();

                      if (s.getSymbolType() == SymbolType.FUNCTION) {
                          continue;
                      }

                      imports.println(
                          s.getName() + " @ " + s.getAddress());
                  }

                  InstructionIterator instructions =
                      currentProgram.getListing()
                      .getInstructions(true);

                  while (instructions.hasNext()) {
                      Instruction i = instructions.next();
                      asm.println(i.getAddress() + " " + i);
                  }

                  c.close();
                  symbols.close();
                  imports.close();
                  asm.close();
                  dc.dispose();
              }
          }
          JAVA

      - name: Analyze PRX files
        run: |
          FOUND=0

          for PRX in input/*.prx; do
            [ -f "$PRX" ] || continue
            FOUND=1

            NAME=$(basename "$PRX" .prx)
            DEST="output/$NAME"

            mkdir -p "$DEST/original"

            cp "$PRX" "$DEST/original/$NAME.prx"

            file "$PRX" > "$DEST/file_info.txt"
            strings -a "$PRX" > "$DEST/strings.txt"

            readelf -a "$PRX" \
              > "$DEST/elf_info.txt" 2>&1 || true

            readelf -r "$PRX" \
              > "$DEST/relocations.txt" 2>&1 || true

            objdump -D "$PRX" \
              > "$DEST/disassembly.txt" 2>&1 || true

            "$GHIDRA" \
              /tmp/ghidra-project \
              "$NAME" \
              -import "$PRX" \
              -scriptPath scripts \
              -postScript Decompile.java "$DEST" \
              -deleteProject || {
                echo "Ghidra analysis failed: $NAME"
              }

          done

          if [ "$FOUND" -eq 0 ]; then
            echo "No PRX files found in input/"
            exit 1
          fi

      - name: Generate recovered source project
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          for plugin in Path("output").iterdir():
              if not plugin.is_dir():
                  continue

              src = plugin / "src"
              inc = plugin / "include"
              asm = plugin / "asm"
              data = plugin / "data"

              for d in (src, inc, asm, data):
                  d.mkdir(exist_ok=True)

              def read(name):
                  p = plugin / name
                  return p.read_text(errors="replace") if p.exists() else ""

              code = read("decompiled.c")
              symbols = read("symbols.txt")
              imports = read("imports.txt")
              strings = read("strings.txt")
              assembly = read("assembly.asm")
              elf = read("elf_info.txt")
              relocations = read("relocations.txt")

              # Split Ghidra output into individual functions.
              parts = re.split(
                  r'(?=/\*\s*Function:)',
                  code
              )

              functions = []
              declarations = []

              for part in parts:
                  part = part.strip()

                  if not part or "Function:" not in part:
                      continue

                  match = re.search(
                      r'/\*\s*Function:\s*(.*?)\s*\*/',
                      part
                  )

                  name = (
                      match.group(1) if match
                      else f"function_{len(functions)}"
                  )

                  safe = re.sub(
                      r'[^A-Za-z0-9_]',
                      '_',
                      name
                  )

                  functions.append(part)

                  (src / f"{safe}.c").write_text(
                      "/* Reconstructed pseudocode */\n"
                      + part + "\n"
                  )

                  declarations.append(
                      f"/* Recovered: {name} */"
                  )

              # Combined recovered code.
              (src / "main.c").write_text(
                  "/* Reconstructed PRX functions */\n\n"
                  + "\n\n".join(functions)
              )

              (src / "functions.c").write_text(
                  "\n\n".join(functions)
              )

              # Imported symbols are not implementations.
              (data / "imports.txt").write_text(imports)

              (src / "imports.c").write_text(
                  "/* Imported symbol information is in data/imports.txt */\n"
              )

              (src / "hooks.c").write_text(
                  "/* No hook implementation is generated unless "
                  "Ghidra recovers its function body. */\n"
              )

              (inc / "functions.h").write_text(
                  "#pragma once\n\n"
                  + "\n".join(declarations)
              )

              (inc / "imports.h").write_text(
                  "#pragma once\n"
                  "/* Imported symbol metadata: data/imports.txt */\n"
              )

              (inc / "types.h").write_text(
                  "#pragma once\n"
                  "/* Types reconstructed by manual review */\n"
              )

              (inc / "structures.h").write_text(
                  "#pragma once\n"
                  "/* Structure definitions require verification */\n"
              )

              (asm / "main.asm").write_text(assembly)

              (data / "symbols.txt").write_text(symbols)
              (data / "strings.txt").write_text(strings)
              (data / "elf_info.txt").write_text(elf)
              (data / "relocations.txt").write_text(relocations)

              (plugin / "README.md").write_text(
                  "# GoldHEN PRX Reconstructed Source\n\n"
                  "Generated using Ghidra static analysis.\n\n"
                  "The source is reconstructed pseudocode, "
                  "not guaranteed original source code.\n"
                  "Unresolved functions, imports and types "
                  "require manual analysis.\n"
              )

              (plugin / "Makefile").write_text(
                  "# Reconstructed analysis project\n"
                  "all:\n"
                  "\t@echo 'Original PS4 SDK and build configuration required.'\n"
              )

              (plugin / "report.txt").write_text(
                  f"Plugin: {plugin.name}\n"
                  f"Recovered functions: {len(functions)}\n"
                  f"Symbols: {len(symbols.splitlines())}\n"
                  f"Imports: {len(imports.splitlines())}\n"
              )

              print(
                  f"{plugin.name}: {len(functions)} functions recovered"
              )
          PY

      - name: Package source dump
        run: |
          cd output

          zip -qr ../GoldHEN-Full-Source-Dump.zip .

          cd ..

          sha256sum GoldHEN-Full-Source-Dump.zip \
            > GoldHEN-Full-Source-Dump.sha256

      - name: Upload pull request artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: GoldHEN-Source-${{ github.sha }}
          path: |
            GoldHEN-Full-Source-Dump.zip
            GoldHEN-Full-Source-Dump.sha256

      - name: Determine release tag
        if: github.event_name != 'pull_request'
        id: vars
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            echo "tag_name=$TAG" >> "$GITHUB_OUTPUT"
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          else
            TAG="goldhen-source-${GITHUB_RUN_NUMBER}"
            echo "tag_name=$TAG" >> "$GITHUB_OUTPUT"
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.vars.outputs.tag_name }}
          IS_REL: ${{ steps.vars.outputs.is_release }}
        run: |
          set -e

          if [ "$IS_REL" = "true" ]; then
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release upload "$TAG" \
                GoldHEN-Full-Source-Dump.zip \
                GoldHEN-Full-Source-Dump.sha256 \
                --clobber
            else
              gh release create "$TAG" \
                GoldHEN-Full-Source-Dump.zip \
                GoldHEN-Full-Source-Dump.sha256 \
                --target "$GITHUB_SHA" \
                --title "GoldHEN Source $TAG" \
                --generate-notes
            fi
          else
            gh release create "$TAG" \
              GoldHEN-Full-Source-Dump.zip \
              GoldHEN-Full-Source-Dump.sha256 \
              --target "$GITHUB_SHA" \
              --title "GoldHEN Source $TAG" \
              --prerelease \
              --generate-notes
          fi

      - name: Print release URL
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.vars.outputs.tag_name }}
        run: |
          URL=$(gh release view "$TAG" --json url --jq .url)
          SHA=$(sha256sum GoldHEN-Full-Source-Dump.zip | awk '{print $1}')

          {
            echo "=================================="
            echo "GOLDHEN SOURCE DUMP SUCCESS"
            echo "=================================="
            echo "Release URL: $URL"
            echo "SHA256: $SHA"
            echo "=================================="
          } | tee -a "$GITHUB_STEP_SUMMARY"

          echo "[Download Full Source Dump]($URL)" \
            >> "$GITHUB_STEP_SUMMARY"
